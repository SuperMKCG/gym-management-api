
spring.application.name=gym

spring.datasource.url=jdbc:mysql://localhost:3306/gym_system?useSSL=false&serverTimezone=UTC

# Usuario de la base de datos: reemplazar por el usuario configurado en MySQL
spring.datasource.username=YOUR_DB_USERNAME

# Contraseña de la base de datos: reemplazar por la contraseña correspondiente
spring.datasource.password=YOUR_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update

# Clave secreta para firmar y validar los JWT.
# Recomendación: utilizar al menos 32 bytes (256 bits) generados aleatoriamente.
# En producción, almacenar la clave en una variable de entorno, nunca en el repositorio.
jwt.secret=${JWT_SECRET}
